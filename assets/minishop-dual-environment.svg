<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">MiniShop dual environment — Docker on Windows</title>
<desc id="desc">An animated diagram showing a Windows host routing HTTP requests to the original MiniShop at localhost port 5000 and secure MiniShop at localhost port 5002, each in an isolated Docker container with its own database.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1328"/><stop offset="1" stop-color="#111d37"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".40"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ffb45d" stroke-width="1.5"/></marker>
  <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#6ee7b7" stroke-width="1.5"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .heading{fill:#f8fafc;font-size:31px;font-weight:750;letter-spacing:-.9px}
    .sub{fill:#9caecc;font-size:14px}
    .label{fill:#dbeafe;font-size:14px;font-weight:600}
    .tiny{fill:#93a4c4;font-size:12px}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .orb{animation:orbpulse 4s ease-in-out infinite}
    .trace{stroke-dasharray:5 10;animation:dash 1.1s linear infinite}
    .packet1{animation:packetOne 4.1s ease-in-out infinite;filter:drop-shadow(0 0 7px #fbbf24)}
    .packet2{animation:packetTwo 4.1s ease-in-out infinite;filter:drop-shadow(0 0 7px #34d399)}
    .float{animation:float 5s ease-in-out infinite}
    .float2{animation:float 5s ease-in-out -2.5s infinite}
    .status{animation:status 2.2s ease-in-out infinite}
    .status2{animation:status 2.2s ease-in-out -1.1s infinite}
    @keyframes dash{to{stroke-dashoffset:-30}}
    @keyframes orbpulse{50%{opacity:.38;transform:scale(1.05)}}
    @keyframes float{50%{transform:translateY(-4px)}}
    @keyframes status{50%{opacity:.45}}
    @keyframes packetOne{0%,7%{offset-distance:0%;opacity:0}12%{opacity:1}44%{offset-distance:100%;opacity:1}50%,100%{offset-distance:100%;opacity:0}}
    @keyframes packetTwo{0%,18%{offset-distance:0%;opacity:0}23%{opacity:1}57%{offset-distance:100%;opacity:1}63%,100%{offset-distance:100%;opacity:0}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
  </style>
</defs>
<rect width="1120" height="590" rx="23" fill="url(#bg)"/>
<circle cx="910" cy="60" r="190" fill="#0ea5e9" opacity=".055" filter="url(#soft)" class="orb"/>
<circle cx="130" cy="480" r="190" fill="#4f46e5" opacity=".075" filter="url(#soft)" class="orb"/>
<g opacity=".14" stroke="#395073" stroke-width="1">
  <path d="M0 90 H1120 M0 180 H1120 M0 270 H1120 M0 360 H1120 M0 450 H1120 M0 540 H1120"/>
  <path d="M80 0 V590 M240 0 V590 M400 0 V590 M560 0 V590 M720 0 V590 M880 0 V590 M1040 0 V590"/>
</g>
<text x="58" y="65" class="heading">Two versions. One Windows PC.</text>
<text x="58" y="92" class="sub">Reproducible MiniShop SSDLC demonstration · Docker Desktop + WSL 2</text>
<rect x="914" y="45" width="145" height="32" rx="16" fill="#172e40" stroke="#285166"/>
<circle cx="936" cy="61" r="5" fill="#34d399" class="status"/>
<text x="950" y="66" fill="#b7efdf" font-size="12" font-weight="650">LOCAL ONLY</text>

<!-- Host -->
<g class="float">
 <rect x="414" y="122" width="292" height="111" rx="17" fill="#16223c" stroke="#526686" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="438" y="145" width="48" height="43" rx="8" fill="#123b62"/>
 <path d="M450 155 H472 V177 H450Z M461 155 V177 M450 166 H472" fill="none" stroke="#7dd3fc" stroke-width="2"/>
 <text x="502" y="162" class="label" font-size="17">Windows host</text>
 <text x="502" y="182" class="tiny">Browser + Docker Desktop</text>
 <text x="502" y="204" fill="#c9d8ec" font-size="12">HTTP requests</text>
</g>

<!-- branching wires -->
<path id="routeL" d="M508 233 V262 H294 V302" fill="none" stroke="#ffb45d" stroke-width="2" stroke-opacity=".9" marker-end="url(#arrowOrange)"/>
<path id="routeR" d="M612 233 V262 H826 V302" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity=".9" marker-end="url(#arrowGreen)"/>
<path d="M508 233 V262 H294 V302" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity=".8" class="trace"/>
<path d="M612 233 V262 H826 V302" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity=".8" class="trace"/>
<circle r="7" fill="#fbbf24" class="packet1" style="offset-path:path('M508 233 V262 H294 V302');offset-rotate:0deg"/>
<circle r="7" fill="#34d399" class="packet2" style="offset-path:path('M612 233 V262 H826 V302');offset-rotate:0deg"/>
<rect x="178" y="248" width="136" height="29" rx="14" fill="#2e211d" stroke="#905425"/>
<text x="246" y="267" font-size="12" font-weight="650" text-anchor="middle" fill="#ffd29a" class="mono">localhost:5000</text>
<rect x="807" y="248" width="136" height="29" rx="14" fill="#153529" stroke="#25795b"/>
<text x="875" y="267" font-size="12" font-weight="650" text-anchor="middle" fill="#a7f3d0" class="mono">localhost:5002</text>

<!-- Docker platform -->
<rect x="42" y="292" width="1036" height="233" rx="23" fill="#101b31" fill-opacity=".75" stroke="#304466" stroke-width="1.4"/>
<text x="67" y="319" fill="#9ab8dd" font-size="12" font-weight="700" letter-spacing="1.4">DOCKER ENVIRONMENTS</text>

<!-- original -->
<g class="float2">
<rect x="65" y="332" width="477" height="166" rx="16" fill="#211e26" stroke="#af6a35" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="65" y="332" width="477" height="7" rx="3.5" fill="url(#orange)"/>
<rect x="84" y="353" width="50" height="48" rx="12" fill="#3a2d2c"/>
<path d="M109 364 L122 370 V381 C122 388 116 394 109 397 C102 394 96 388 96 381 V370Z" fill="none" stroke="#fbbf24" stroke-width="2.3"/>
<path d="M104 379 L109 384 L117 375" stroke="#fbbf24" stroke-width="2.1" fill="none"/>
<text x="150" y="373" fill="#ffdda8" font-size="21" font-weight="750">Original MiniShop</text>
<text x="150" y="394" fill="#c6a68b" font-size="13">Intentionally vulnerable baseline</text>
<rect x="84" y="416" width="200" height="52" rx="10" fill="#15171e" stroke="#69503b"/>
<text x="99" y="434" class="tiny">Host → container</text>
<text x="99" y="455" fill="#fbbf24" font-size="18" font-weight="750" class="mono">5000 → 5000</text>
<rect x="300" y="416" width="218" height="52" rx="10" fill="#15171e" stroke="#69503b"/>
<text x="313" y="434" class="tiny">Isolated data volume</text>
<text x="313" y="455" fill="#d2d7e2" font-size="14" font-weight="650">SQLite · baseline</text>
<circle cx="503" cy="368" r="6" fill="#fbbf24" class="status"/>
</g>

<!-- secure -->
<g class="float">
<rect x="578" y="332" width="477" height="166" rx="16" fill="#17272b" stroke="#277e6a" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="578" y="332" width="477" height="7" rx="3.5" fill="url(#green)"/>
<rect x="597" y="353" width="50" height="48" rx="12" fill="#1b423d"/>
<path d="M622 364 L635 370 V381 C635 388 629 394 622 397 C615 394 609 388 609 381 V370Z" fill="none" stroke="#6ee7b7" stroke-width="2.3"/>
<path d="M616 380 L621 385 L630 375" stroke="#6ee7b7" stroke-width="2.3" fill="none"/>
<text x="663" y="373" fill="#c8ffe8" font-size="21" font-weight="750">Secure MiniShop</text>
<text x="663" y="394" fill="#9dbfb4" font-size="13">Remediated + verified</text>
<rect x="597" y="416" width="200" height="52" rx="10" fill="#101e20" stroke="#35675d"/>
<text x="612" y="434" class="tiny">Host → container</text>
<text x="612" y="455" fill="#6ee7b7" font-size="18" font-weight="750" class="mono">5002 → 5000</text>
<rect x="813" y="416" width="218" height="52" rx="10" fill="#101e20" stroke="#35675d"/>
<text x="826" y="434" class="tiny">Isolated data volume</text>
<text x="826" y="455" fill="#d2e8dd" font-size="14" font-weight="650">SQLite · secure</text>
<circle cx="1016" cy="368" r="6" fill="#34d399" class="status2"/>
</g>
<text x="560" y="563" fill="#91a5c2" font-size="13" text-anchor="middle">Separate host ports · separate Compose projects · separate database volumes</text>
</svg>
